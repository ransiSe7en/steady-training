name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Core checks
        run: npm test && npm run check
      - name: Restore stable personal signing key
        env:
          SIGNING_KEY: ${{ secrets.STEADY_DEBUG_KEYSTORE }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/steady.keystore"
          echo "STEADY_KEYSTORE_PATH=$RUNNER_TEMP/steady.keystore" >> "$GITHUB_ENV"
      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: steady-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

